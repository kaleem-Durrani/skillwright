<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to real
         numbers on notched devices; without it the bottom tab bar sits under the
         home indicator. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12161d" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Skillwright — vocational training, permissions first." />
    <title>Skillwright</title>

    <!-- icon.svg is the primary favicon (modern browsers prefer it over the PNG);
         favicon-32.png is the fallback for the ones that don't. Both are the same
         ember-filled SW mark AppShell.tsx draws in the top bar. -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <!-- Flat, opaque square — deliberately not rounded like the other icons. iOS
         masks this itself, and a pre-rounded PNG with transparent corners is what
         makes a home-screen icon show up with black corners. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Skillwright" />
    <meta property="og:title" content="Skillwright" />
    <meta
      property="og:description"
      content="Skillwright — vocational training, permissions first."
    />
    <meta property="og:url" content="https://skillwright.dev/" />
    <meta property="og:image" content="https://skillwright.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Skillwright" />
    <meta
      name="twitter:description"
      content="Skillwright — vocational training, permissions first."
    />
    <meta name="twitter:image" content="https://skillwright.dev/og-image.png" />

    <!--
      Blocking, deliberately. This runs before the first paint so the document is
      never painted in the wrong theme and then corrected — that flash is the one
      bug users notice on every single navigation.
      "system" stamps NOTHING, so the prefers-color-scheme rules in tokens.css win.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('sw.theme');
          var root = document.documentElement;
          if (stored === 'dark' || stored === 'light') {
            root.setAttribute('data-theme', stored);
          } else {
            root.removeAttribute('data-theme');
          }
          var dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          /* private mode: fall through to the CSS default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

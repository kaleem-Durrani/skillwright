name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  # No PNPM_VERSION here on purpose. pnpm/action-setup@v4 reads the version from
  # the root package.json's `packageManager` field, and passing a `version` input
  # as well is not a fallback — the action compares the two as raw strings and
  # THROWS on any difference. '9' vs 'pnpm@9.15.4' differs, so every job in this
  # file aborted at the setup step. One source of truth: package.json.
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  # Warms the pnpm store cache once so the nine jobs below install from it in
  # parallel instead of hammering the registry nine times.
  setup:
    name: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prisma client
        run: pnpm --filter @skillwright/db exec prisma generate

  typecheck:
    name: typecheck
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @skillwright/db exec prisma generate
      - run: pnpm typecheck
      # scripts/ belongs to no workspace, so `turbo run typecheck` never saw it.
      # Two CI gates and the screenshot generator live there; one of them was
      # already setting a field that no longer exists on `Subject`.
      - run: pnpm typecheck:scripts

  lint:
    name: lint
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @skillwright/db exec prisma generate
      - run: pnpm lint

  format:
    name: format:check
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  # The product name may be spelled in exactly one file; the old name in none.
  check-brand:
    name: check:brand
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:brand

  # Mobile-first is a constraint, not a preference. This job is the difference.
  check-mobile-first:
    name: check:mobile-first
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:mobile-first

  unit:
    name: unit tests (policy matrix + web components)
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The policy matrix needs no database, no Redis and no fixtures — it touches
      # no I/O by construction, which is the whole reason the policy module is
      # pure. It runs here, in the fast job, so a permissions regression is named
      # in seconds rather than after a container boot.
      - name: Policy matrix and shared unit tests
        run: pnpm --filter @skillwright/shared test -- --coverage

      # apps/web's suite ran in NO job until 2026-08-30 — `unit` filtered to shared
      # and `integration` to api, so 178 tests pinning role-gated rendering, form
      # validation against the shared schemas and the toast/dialog contracts were
      # gating nothing. jsdom, no I/O, no containers: it belongs in the fast job.
      - name: Web component tests
        run: pnpm --filter @skillwright/web test

      # packages/db declared no test script at all until 2026-08-30, so `turbo run test`
      # skipped ~2,000 lines including the audit extension — the append-only trail the
      # whole authorization story rests on. These tests need no database (they drive the
      # extension's pure parts, the logger's level table and the TOTP envelope) but they
      # DO need a generated Prisma client, because src/audit.ts value-imports
      # @prisma/client. turbo.json now carries that edge for local runs; this job calls
      # the package script directly, so it states the dependency itself.
      - name: Prisma client for the db package tests
        run: pnpm --filter @skillwright/db exec prisma generate
      - name: Database-package unit tests
        run: pnpm --filter @skillwright/db test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: packages/shared/coverage/**
          if-no-files-found: ignore
          retention-days: 14

  integration:
    name: integration tests
    needs: setup
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: skillwright
          POSTGRES_PASSWORD: skillwright
          POSTGRES_DB: skillwright_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillwright -d skillwright_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://skillwright:skillwright@localhost:5432/skillwright_test?schema=public
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @skillwright/db exec prisma generate

      # Migrations are applied, never pushed. If a committed migration is broken,
      # this is where it is discovered — not in production.
      - name: Apply migrations
        run: pnpm --filter @skillwright/db exec prisma migrate deploy

      # test/uploads.test.ts signs a PUT with storage.ts and then actually fetch()es
      # it — a real object store, not a mock. `services:` cannot run this image: the
      # official minio/minio container needs `server /data` as its command and
      # GitHub Actions service containers cannot override a service's command, only
      # its env/ports/health-check. So MinIO runs as a plain container instead,
      # started the same way docker-compose.yml runs it (minio service + minio-init
      # commands, docker-compose.yml:39-63) but as workflow steps.
      - name: Start MinIO
        run: |
          docker network create minio-net
          docker run -d --name minio --network minio-net -p 9000:9000 \
            -e MINIO_ROOT_USER=skillwright \
            -e MINIO_ROOT_PASSWORD=skillwright-dev-secret \
            minio/minio:latest server /data

      # Credentials, bucket name and port match the S3_* fallbacks setup.ts:68-73
      # supplies, so the API under test needs no extra env here. The bucket is
      # created over the docker network by name (not "localhost") because this step
      # itself runs inside a throwaway mc container, not on the runner directly.
      - name: Wait for MinIO and create the uploads bucket
        run: |
          timeout 60 sh -c 'until curl -sf http://localhost:9000/minio/health/live; do sleep 2; done'
          docker run --rm --network minio-net --entrypoint /bin/sh minio/mc:latest -c "
            mc alias set local http://minio:9000 skillwright skillwright-dev-secret &&
            mc mb --ignore-existing local/skillwright-uploads &&
            mc anonymous set none local/skillwright-uploads
          "

      # apps/api's suite talks to the real Postgres, Redis and MinIO above. No
      # mocks: a test that mocks the database cannot catch a broken migration, a
      # missing index, or a CHECK constraint that does not hold.
      - name: Integration tests
        run: pnpm --filter @skillwright/api test -- --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: apps/api/coverage/**
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: build
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @skillwright/db exec prisma generate
      - run: pnpm build
      - name: Upload SPA bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

  # The image was built and run by hand once — cc85a6e, 2026-08-23 — and the six
  # faults that surfaced in the first hour are written up as lesson 38. This job makes
  # that repeatable: build only, no push, no registry credentials, so a broken image
  # fails CI like a broken test rather than on deploy day.
  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: skillwright:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # docs/permissions.md is generated from the policy. If the two disagree, the
  # documentation is wrong and this build is wrong with it.
  permissions-doc:
    name: permissions doc is current
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # @skillwright/shared publishes its TypeScript sources through its exports
      # map, so tsx imports the live policy directly — no build step, and no
      # chance of checking a stale artifact.
      - run: pnpm docs:permissions -- --check

  # The gate that did not exist, and the reason a white screen shipped on main.
  #
  # Every other job in this file reads the SOURCE. `typecheck` reads it, `unit`
  # runs it in jsdom, and `build` only asks whether Rollup exits 0. None of them
  # opens the artefact. A `manualChunks` predicate split @tanstack/react-router
  # across two vendor chunks that imported each other, the built SPA threw on
  # every page, and this whole workflow stayed green over it — because nothing
  # here had ever loaded the thing it produces.
  #
  # So this job builds the SPA and drives the built bundle in a real browser at
  # three viewports. e2e/build-smoke.spec.ts asks only "did it run", which is the
  # question that was unasked; e2e/dialogs.spec.ts and e2e/mobile-shell.spec.ts
  # carry the accessibility and touch-target contracts, which need a browser too
  # and have until now depended on someone remembering to run them locally.
  #
  # It needs no database, no Redis and no seed: the specs stub /api/v1 at the
  # network layer (e2e/fixtures.ts), so this stays a fast job that gates a push.
  e2e:
    name: e2e (built bundle, 3 viewports)
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @skillwright/db exec prisma generate

      # chromium backs the desktop and Pixel-7 projects; webkit backs the iPhone
      # one. ADR 0008 makes the phone the baseline, so a suite that installs only
      # chromium would certify the enhancement and skip the thing being enhanced.
      - name: Install Playwright browsers
        run: pnpm --filter @skillwright/web exec playwright install --with-deps chromium webkit

      # playwright.config.ts serves the result with `vite preview`, so the build
      # has to happen first and the tests run against dist/ — not the dev server,
      # which never applies manualChunks and would have hidden the bug outright.
      - name: Build the SPA
        run: pnpm --filter @skillwright/web build

      - name: Playwright
        run: pnpm --filter @skillwright/web test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/**
            apps/web/test-results/**
          if-no-files-found: ignore
          retention-days: 14

  # The gate for the five golden paths — the other half of the `e2e` job above.
  #
  # That job drives the built bundle with every /api/v1 call answered by
  # e2e/fixtures.ts, always already signed in as an ADMIN. It is fast, it needs no
  # database, and it is exactly the right shape for what it asks: does the bundle
  # run, is this dialog accessible. What it structurally cannot see is everything
  # BETWEEN the SPA and the API — the login form, the session cookie, a policy
  # refusal, a revoked session, a seat that changes hands — because it never
  # authenticates and no assertion in it has ever reached Postgres. That is lesson
  # 20's gap, still open: "ask what your test suite structurally cannot see; for a
  # SPA and an API tested separately, the answer is always the thing that joins them".
  #
  # So this job runs the real thing. Migrations, the real seed, the API serving the
  # BUILT SPA out of WEB_DIST_DIR on one origin — the Dockerfile's topology, not the
  # dev proxy's — and Playwright signing in through the actual login form with the
  # seed's demo credentials. Kept as a separate job rather than more specs in `e2e`
  # because it costs containers and a seed, and `e2e` earns its place by being the
  # cheap one that gates every push.
  e2e-real-stack:
    name: e2e (real stack, golden paths)
    needs: setup
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: skillwright
          POSTGRES_PASSWORD: skillwright
          # NOT `skillwright_test`. That database belongs to the integration suite,
          # whose fixtures delete every user between files (lesson 9's guard refuses
          # any name not ending in `_test` for exactly that reason). This one is
          # seeded and read as a whole, so it gets its own name and its own service.
          POSTGRES_DB: skillwright_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillwright -d skillwright_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Job-wide, because three different things read it: `prisma migrate deploy`, the
    # seed, and the API process Playwright starts (playwright.config.ts's webServer,
    # which inherits this environment and overrides only PORT and WEB_DIST_DIR).
    # There is no repo-root .env on a runner, so env.ts parses exactly what is here
    # and every key it declares as required has to appear.
    env:
      DATABASE_URL: postgresql://skillwright:skillwright@localhost:5432/skillwright_e2e?schema=public
      REDIS_URL: redis://localhost:6379
      NODE_ENV: development
      # `local`, not `ci`, and the reason is one line in session.service.ts:
      # `cookieIsSecure = SESSION_COOKIE_NAME.startsWith('__Host-') || DEPLOY_ENV !== 'local'`.
      # This suite drives plain HTTP on localhost, where a Secure cookie is a coin
      # toss across browsers and a silently missing session cookie is the worst
      # possible failure to debug. The developer .env makes the same two choices for
      # the same reason.
      DEPLOY_ENV: local
      SESSION_COOKIE_NAME: sw_session
      # The dev-only key from .env.example, verbatim. It must be the SAME value for
      # the seed and the API: the seed encrypts the demo admin's TOTP secret with it
      # and the API decrypts with it.
      ENCRYPTION_KEY: ZGV2LW9ubHktMzItYnl0ZS1rZXktY2hhbmdlLW1lISE=
      # Every request in this job is same-origin, so the CSRF hook passes on
      # `Sec-Fetch-Site` and never consults this list. It is set because env.ts
      # requires a non-empty one, and it names the origin the suite actually uses.
      ALLOWED_ORIGINS: http://localhost:4010
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: skillwright-uploads
      S3_ACCESS_KEY_ID: skillwright
      S3_SECRET_ACCESS_KEY: skillwright-dev-secret
      S3_FORCE_PATH_STYLE: 'true'
      # No Mailpit here. `sendMail` catches its own failures and never rejects
      # (mailer.ts), so a refused SMTP connection logs a line and changes no
      # response — and nothing in these specs reads a message.
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      MAIL_FROM: Skillwright <no-reply@skillwright.local>
      # The one-click demo login is off: these specs sign in with a password on
      # purpose (a DEMO-provenance session is refused `user:suspend` by DEMO_DENIED,
      # which would break the suspension path), so the route has no business existing
      # here. auth.setup.ts asserts the absence of the "Demo" badge to prove it.
      DEMO_MODE: 'false'
      LOG_LEVEL: warn

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @skillwright/db exec prisma generate

      # The object store, started the way the `integration` job starts it and for the
      # same reason: `services:` cannot run this image, because the official
      # minio/minio container needs `server /data` as its command and GitHub Actions
      # can override a service's env, ports and health-check but never its command.
      #
      # Honest about what it is for: no spec in this job reads a byte from it today —
      # presigning is an offline computation and nothing here downloads a file. It
      # runs because the API in this job is configured to talk to a real store rather
      # than a fiction, and because golden path 3 (upload, download, and the raw
      # unsigned object URL answering 403) is the one path missing from this suite;
      # whoever writes it should find a working bucket rather than this comment.
      - name: Start MinIO
        run: |
          docker network create minio-net
          docker run -d --name minio --network minio-net -p 9000:9000 \
            -e MINIO_ROOT_USER=skillwright \
            -e MINIO_ROOT_PASSWORD=skillwright-dev-secret \
            minio/minio:latest server /data

      - name: Wait for MinIO and create the uploads bucket
        run: |
          timeout 60 sh -c 'until curl -sf http://localhost:9000/minio/health/live; do sleep 2; done'
          docker run --rm --network minio-net --entrypoint /bin/sh minio/mc:latest -c "
            mc alias set local http://minio:9000 skillwright skillwright-dev-secret &&
            mc mb --ignore-existing local/skillwright-uploads &&
            mc anonymous set none local/skillwright-uploads
          "

      # Applied, never pushed — the same rule the integration job states. A committed
      # migration that does not apply is discovered here rather than in production.
      - name: Apply migrations
        run: pnpm --filter @skillwright/db exec prisma migrate deploy

      # The whole point: these specs assert against the seed a reader of the README
      # is told to sign in to. The seed is deterministic and idempotent.
      - name: Seed
        run: pnpm --filter @skillwright/db run seed

      # chromium only. The real-stack project runs one viewport (playwright.config.ts
      # argues why), so installing webkit here would download a browser nothing opens.
      - name: Install Playwright chromium
        run: pnpm --filter @skillwright/web exec playwright install --with-deps chromium

      # The API serves THIS directory as the SPA, so the build must precede it. Same
      # artefact the `e2e` job drives, reached through the process that serves it in
      # production instead of through `vite preview`.
      - name: Build the SPA
        run: pnpm --filter @skillwright/web build

      # `--project` is what adds the real-stack projects and the API webServer to the
      # config at all; without it this command runs the stubbed suite. E2E_REAL_STACK
      # says the same thing through the environment, so the job still selects the
      # right suite if an argument ever fails to survive `pnpm exec`.
      - name: Golden paths against the real stack
        env:
          E2E_REAL_STACK: '1'
        run: pnpm --filter @skillwright/web exec playwright test --project=real-stack

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-real-stack
          path: |
            apps/web/playwright-report/**
            apps/web/test-results/**
          if-no-files-found: ignore
          retention-days: 14

  ci:
    name: CI
    if: always()
    needs:
      - setup
      - typecheck
      - lint
      - format
      - check-brand
      - check-mobile-first
      - unit
      - integration
      - build
      - e2e
      - e2e-real-stack
      - docker
      - permissions-doc
    runs-on: ubuntu-latest
    steps:
      # Enumerating the BAD states is how this gate came to certify a commit that
      # never built. If `setup` fails, every job that needs it reports `skipped` —
      # not `failure` — and `docker`, the one job with no `needs:`, still runs and
      # passes on its own. The old grep for `failure|cancelled` matched neither, so
      # the gate printed "All required jobs succeeded" over ten jobs that had not
      # executed a single test. `setup` was also absent from the needs list, so its
      # own failure never entered the join to be matched in the first place.
      #
      # Assert the one acceptable state instead of listing the unacceptable ones:
      # every result must be exactly `success`. That closes `skipped` and whatever
      # result value GitHub adds next, together.
      - name: Every required job must have succeeded
        run: |
          results='${{ join(needs.*.result, " ") }}'
          echo "results: ${results}"
          if [ -z "${results}" ]; then
            echo "::error title=CI::No job results reached the gate."
            exit 1
          fi
          for result in ${results}; do
            if [ "${result}" != "success" ]; then
              echo "::error title=CI::A required job reported '${result}'. A skipped job is a failure here."
              exit 1
            fi
          done
          echo "All required jobs succeeded."

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  # No PNPM_VERSION here on purpose. pnpm/action-setup@v4 reads the version from
  # the root package.json's `packageManager` field, and passing a `version` input
  # as well is not a fallback — the action compares the two as raw strings and
  # THROWS on any difference. '9' vs 'pnpm@9.15.4' differs, so every job in this
  # file aborted at the setup step. One source of truth: package.json.
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  # Warms the pnpm store cache once so the nine jobs below install from it in
  # parallel instead of hammering the registry nine times.
  setup:
    name: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prisma client
        run: pnpm --filter @skillwright/db exec prisma generate

  typecheck:
    name: typecheck
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @skillwright/db exec prisma generate
      - run: pnpm typecheck
      # scripts/ belongs to no workspace, so `turbo run typecheck` never saw it.
      # Two CI gates and the screenshot generator live there; one of them was
      # already setting a field that no longer exists on `Subject`.
      - run: pnpm typecheck:scripts

  lint:
    name: lint
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @skillwright/db exec prisma generate
      - run: pnpm lint

  format:
    name: format:check
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  # The product name may be spelled in exactly one file; the old name in none.
  check-brand:
    name: check:brand
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:brand

  # Mobile-first is a constraint, not a preference. This job is the difference.
  check-mobile-first:
    name: check:mobile-first
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:mobile-first

  unit:
    name: unit tests (policy matrix + web components)
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The policy matrix needs no database, no Redis and no fixtures — it touches
      # no I/O by construction, which is the whole reason the policy module is
      # pure. It runs here, in the fast job, so a permissions regression is named
      # in seconds rather than after a container boot.
      - name: Policy matrix and shared unit tests
        run: pnpm --filter @skillwright/shared test -- --coverage

      # apps/web's suite ran in NO job until 2026-08-30 — `unit` filtered to shared
      # and `integration` to api, so 178 tests pinning role-gated rendering, form
      # validation against the shared schemas and the toast/dialog contracts were
      # gating nothing. jsdom, no I/O, no containers: it belongs in the fast job.
      - name: Web component tests
        run: pnpm --filter @skillwright/web test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: packages/shared/coverage/**
          if-no-files-found: ignore
          retention-days: 14

  integration:
    name: integration tests
    needs: setup
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: skillwright
          POSTGRES_PASSWORD: skillwright
          POSTGRES_DB: skillwright_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillwright -d skillwright_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://skillwright:skillwright@localhost:5432/skillwright_test?schema=public
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @skillwright/db exec prisma generate

      # Migrations are applied, never pushed. If a committed migration is broken,
      # this is where it is discovered — not in production.
      - name: Apply migrations
        run: pnpm --filter @skillwright/db exec prisma migrate deploy

      # test/uploads.test.ts signs a PUT with storage.ts and then actually fetch()es
      # it — a real object store, not a mock. `services:` cannot run this image: the
      # official minio/minio container needs `server /data` as its command and
      # GitHub Actions service containers cannot override a service's command, only
      # its env/ports/health-check. So MinIO runs as a plain container instead,
      # started the same way docker-compose.yml runs it (minio service + minio-init
      # commands, docker-compose.yml:39-63) but as workflow steps.
      - name: Start MinIO
        run: |
          docker network create minio-net
          docker run -d --name minio --network minio-net -p 9000:9000 \
            -e MINIO_ROOT_USER=skillwright \
            -e MINIO_ROOT_PASSWORD=skillwright-dev-secret \
            minio/minio:latest server /data

      # Credentials, bucket name and port match the S3_* fallbacks setup.ts:68-73
      # supplies, so the API under test needs no extra env here. The bucket is
      # created over the docker network by name (not "localhost") because this step
      # itself runs inside a throwaway mc container, not on the runner directly.
      - name: Wait for MinIO and create the uploads bucket
        run: |
          timeout 60 sh -c 'until curl -sf http://localhost:9000/minio/health/live; do sleep 2; done'
          docker run --rm --network minio-net --entrypoint /bin/sh minio/mc:latest -c "
            mc alias set local http://minio:9000 skillwright skillwright-dev-secret &&
            mc mb --ignore-existing local/skillwright-uploads &&
            mc anonymous set none local/skillwright-uploads
          "

      # apps/api's suite talks to the real Postgres, Redis and MinIO above. No
      # mocks: a test that mocks the database cannot catch a broken migration, a
      # missing index, or a CHECK constraint that does not hold.
      - name: Integration tests
        run: pnpm --filter @skillwright/api test -- --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: apps/api/coverage/**
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: build
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @skillwright/db exec prisma generate
      - run: pnpm build
      - name: Upload SPA bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

  # The Dockerfile has never been built anywhere — not in CI, not by hand. This job
  # is the first place that happens: build only, no push, no registry credentials.
  # A broken image build has to fail CI exactly like a broken test would, instead
  # of being discovered the day someone tries to deploy.
  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: skillwright:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # docs/permissions.md is generated from the policy. If the two disagree, the
  # documentation is wrong and this build is wrong with it.
  permissions-doc:
    name: permissions doc is current
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # @skillwright/shared publishes its TypeScript sources through its exports
      # map, so tsx imports the live policy directly — no build step, and no
      # chance of checking a stale artifact.
      - run: pnpm docs:permissions -- --check

  # The gate that did not exist, and the reason a white screen shipped on main.
  #
  # Every other job in this file reads the SOURCE. `typecheck` reads it, `unit`
  # runs it in jsdom, and `build` only asks whether Rollup exits 0. None of them
  # opens the artefact. A `manualChunks` predicate split @tanstack/react-router
  # across two vendor chunks that imported each other, the built SPA threw on
  # every page, and this whole workflow stayed green over it — because nothing
  # here had ever loaded the thing it produces.
  #
  # So this job builds the SPA and drives the built bundle in a real browser at
  # three viewports. e2e/build-smoke.spec.ts asks only "did it run", which is the
  # question that was unasked; e2e/dialogs.spec.ts and e2e/mobile-shell.spec.ts
  # carry the accessibility and touch-target contracts, which need a browser too
  # and have until now depended on someone remembering to run them locally.
  #
  # It needs no database, no Redis and no seed: the specs stub /api/v1 at the
  # network layer (e2e/fixtures.ts), so this stays a fast job that gates a push.
  e2e:
    name: e2e (built bundle, 3 viewports)
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @skillwright/db exec prisma generate

      # chromium backs the desktop and Pixel-7 projects; webkit backs the iPhone
      # one. ADR 0008 makes the phone the baseline, so a suite that installs only
      # chromium would certify the enhancement and skip the thing being enhanced.
      - name: Install Playwright browsers
        run: pnpm --filter @skillwright/web exec playwright install --with-deps chromium webkit

      # playwright.config.ts serves the result with `vite preview`, so the build
      # has to happen first and the tests run against dist/ — not the dev server,
      # which never applies manualChunks and would have hidden the bug outright.
      - name: Build the SPA
        run: pnpm --filter @skillwright/web build

      - name: Playwright
        run: pnpm --filter @skillwright/web test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/**
            apps/web/test-results/**
          if-no-files-found: ignore
          retention-days: 14

  ci:
    name: CI
    if: always()
    needs:
      - setup
      - typecheck
      - lint
      - format
      - check-brand
      - check-mobile-first
      - unit
      - integration
      - build
      - e2e
      - docker
      - permissions-doc
    runs-on: ubuntu-latest
    steps:
      # Enumerating the BAD states is how this gate came to certify a commit that
      # never built. If `setup` fails, every job that needs it reports `skipped` —
      # not `failure` — and `docker`, the one job with no `needs:`, still runs and
      # passes on its own. The old grep for `failure|cancelled` matched neither, so
      # the gate printed "All required jobs succeeded" over ten jobs that had not
      # executed a single test. `setup` was also absent from the needs list, so its
      # own failure never entered the join to be matched in the first place.
      #
      # Assert the one acceptable state instead of listing the unacceptable ones:
      # every result must be exactly `success`. That closes `skipped` and whatever
      # result value GitHub adds next, together.
      - name: Every required job must have succeeded
        run: |
          results='${{ join(needs.*.result, " ") }}'
          echo "results: ${results}"
          if [ -z "${results}" ]; then
            echo "::error title=CI::No job results reached the gate."
            exit 1
          fi
          for result in ${results}; do
            if [ "${result}" != "success" ]; then
              echo "::error title=CI::A required job reported '${result}'. A skipped job is a failure here."
              exit 1
            fi
          done
          echo "All required jobs succeeded."

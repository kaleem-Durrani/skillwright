name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9'
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  # Warms the pnpm store cache once so the nine jobs below install from it in
  # parallel instead of hammering the registry nine times.
  setup:
    name: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prisma client
        run: pnpm --filter @skillwright/db exec prisma generate

  typecheck:
    name: typecheck
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @skillwright/db exec prisma generate
      - run: pnpm typecheck

  lint:
    name: lint
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @skillwright/db exec prisma generate
      - run: pnpm lint

  format:
    name: format:check
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  # The product name may be spelled in exactly one file; the old name in none.
  check-brand:
    name: check:brand
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:brand

  # Mobile-first is a constraint, not a preference. This job is the difference.
  check-mobile-first:
    name: check:mobile-first
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:mobile-first

  unit:
    name: unit tests (incl. policy matrix)
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The policy matrix needs no database, no Redis and no fixtures — it touches
      # no I/O by construction, which is the whole reason the policy module is
      # pure. It runs here, in the fast job, so a permissions regression is named
      # in seconds rather than after a container boot.
      - name: Policy matrix and shared unit tests
        run: pnpm --filter @skillwright/shared test -- --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: packages/shared/coverage/**
          if-no-files-found: ignore
          retention-days: 14

  integration:
    name: integration tests
    needs: setup
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: skillwright
          POSTGRES_PASSWORD: skillwright
          POSTGRES_DB: skillwright_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillwright -d skillwright_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://skillwright:skillwright@localhost:5432/skillwright_test?schema=public
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @skillwright/db exec prisma generate

      # Migrations are applied, never pushed. If a committed migration is broken,
      # this is where it is discovered — not in production.
      - name: Apply migrations
        run: pnpm --filter @skillwright/db exec prisma migrate deploy

      # apps/api's suite talks to the real Postgres and the real Redis above. No
      # mocks: a test that mocks the database cannot catch a broken migration, a
      # missing index, or a CHECK constraint that does not hold.
      - name: Integration tests
        run: pnpm --filter @skillwright/api test -- --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-integration
          path: apps/api/coverage/**
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: build
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @skillwright/db exec prisma generate
      - run: pnpm build
      - name: Upload SPA bundle
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

  # docs/permissions.md is generated from the policy. If the two disagree, the
  # documentation is wrong and this build is wrong with it.
  permissions-doc:
    name: permissions doc is current
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # @skillwright/shared publishes its TypeScript sources through its exports
      # map, so tsx imports the live policy directly — no build step, and no
      # chance of checking a stale artifact.
      - run: pnpm docs:permissions -- --check

  ci:
    name: CI
    if: always()
    needs:
      - typecheck
      - lint
      - format
      - check-brand
      - check-mobile-first
      - unit
      - integration
      - build
      - permissions-doc
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        run: |
          if echo '${{ join(needs.*.result, ',') }}' | grep -qE 'failure|cancelled'; then
            echo "One or more required jobs did not succeed."
            exit 1
          fi
          echo "All required jobs succeeded."

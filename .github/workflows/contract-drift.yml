name: Contract drift

# The README claims that the database schema is the single source of truth and
# that a column rename cannot silently reach production. That claim is worth
# nothing unless something tries to break it on every push. This job does.
#
# It renames a column in the Prisma schema on a throwaway branch, regenerates the
# client, and runs `pnpm -r typecheck`. A PASSING typecheck means the type chain
# from Postgres to the SPA is broken somewhere — hand-written duplicate types,
# an `any`, a `@ts-expect-error` — and this job fails to say so.
#
# Inverted assertion. Read the last step carefully before "fixing" it.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'packages/db/prisma/schema.prisma'
      - 'packages/shared/**'
      - 'apps/**'
      - '.github/workflows/contract-drift.yml'
  workflow_dispatch:

concurrency:
  group: contract-drift-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  # No PNPM_VERSION here on purpose. pnpm/action-setup@v4 reads the version from
  # the root package.json's `packageManager` field, and passing a `version` input
  # as well is not a fallback — the action compares the two as raw strings and
  # THROWS on any difference. '9' vs 'pnpm@9.15.4' differs, so every job in this
  # file aborted at the setup step. One source of truth: package.json.
  TURBO_TELEMETRY_DISABLED: '1'
  # The column that gets renamed. Chosen because it is read by the API, carried in
  # a DTO, and rendered by the SPA — so it exercises the whole chain.
  DRIFT_FIELD: capacity
  DRIFT_REPLACEMENT: seatCeiling

jobs:
  prove-drift-breaks-the-build:
    name: a column rename must break the build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Baseline — typecheck must pass BEFORE the rename
        run: |
          pnpm --filter @skillwright/db exec prisma generate
          pnpm -r typecheck

      # A scratch branch, never pushed. It exists so the mutation is a real commit
      # in a real tree rather than an uncommitted edit that a tool might ignore.
      - name: Create scratch branch
        run: |
          git config user.email "ci@example.invalid"
          git config user.name "contract-drift"
          git checkout -b contract-drift-probe

      - name: Rename a column in the Prisma schema
        run: |
          SCHEMA=packages/db/prisma/schema.prisma
          # Anchored to a FIELD DECLARATION, not to any occurrence. A bare word-boundary
          # grep counts 4 matches in this schema and THREE of them are prose in the
          # Phase 9 comment block. So after someone renamed the column the guard would
          # still "find" it, rewrite three comments, watch the typecheck pass, and
          # report contract drift that does not exist.
          before=$(grep -cE "^[[:space:]]*${DRIFT_FIELD}[[:space:]]+" "$SCHEMA" || true)
          if [ "$before" -ne 1 ]; then
            echo "::error::expected exactly ONE '${DRIFT_FIELD}' field declaration in $SCHEMA, found ${before}."
            echo "Point DRIFT_FIELD at a column that is still read by apps/api."
            exit 1
          fi
          sed -i -E "s/^([[:space:]]*)${DRIFT_FIELD}([[:space:]]+)/\1${DRIFT_REPLACEMENT}\2/" "$SCHEMA"
          echo "Renamed the '${DRIFT_FIELD}' declaration -> '${DRIFT_REPLACEMENT}'."
          git --no-pager diff --stat
          git commit -am "test: rename ${DRIFT_FIELD} to prove the type chain holds"

      - name: Regenerate the Prisma client from the mutated schema
        run: pnpm --filter @skillwright/db exec prisma generate

      # SCOPED TO apps/api, deliberately, and this is the whole subtlety of the job.
      #
      # `pnpm -r typecheck` stops at the first failing package, and packages/db fails
      # FIRST — its own seed reads the column that was just renamed. So the inverted
      # assertion was satisfied by packages/db/prisma/seed.ts alone: delete every
      # reference to the column from apps/api and this job STILL reported "Contract
      # holds". A guard whose evidence comes from the same package as the mutation is
      # not evidence.
      #
      # apps/api is the package that genuinely tracks the Prisma type. Note what that
      # means for the claim: what this proves is Postgres -> Prisma -> apps/api. It does
      # NOT reach the SPA, because @skillwright/shared's Zod schemas hand-declare their
      # fields rather than deriving them from Prisma — the same class of debt as the
      # hand-declared CursorPage<T> recorded in NEXT.md. Do not widen this to apps/web
      # without making that half derive first.
      - name: apps/api typecheck must now FAIL
        run: |
          set +e
          pnpm --filter @skillwright/api typecheck
          status=$?
          set -e
          echo "apps/api typecheck exited with ${status}"
          if [ "$status" -eq 0 ]; then
            echo "::error title=Contract drift::Renaming '${DRIFT_FIELD}' in the database schema did NOT break apps/api."
            echo ""
            echo "The type chain Postgres -> Prisma -> apps/api is broken. Something between"
            echo "the schema and the API is hand-written, cast to any, or suppressed with"
            echo "@ts-expect-error. Find it."
            exit 1
          fi
          echo "Contract holds: a database rename breaks apps/api, as claimed."

      # Informational, never asserted. ADR 0006's atomic capacity gate lives in a RAW
      # SQL statement (apps/api/src/modules/enrollments/enrollments.service.ts), and a
      # string is invisible to tsc — rename the column, update every typed site, miss
      # the raw one, and this job stays green while the seat guarantee throws at
      # runtime. Printed every run so the gap is visible rather than remembered.
      - name: What a rename would NOT have broken
        if: always()
        run: |
          echo "Raw-SQL references to the column, which no typecheck can see:"
          grep -rn "${DRIFT_FIELD}" apps/api/src --include=*.ts | grep -iE "raw|sql" || echo "  (none found)"

      - name: Discard the scratch branch
        if: always()
        run: |
          git checkout -f - 2>/dev/null || true
          git branch -D contract-drift-probe 2>/dev/null || true
